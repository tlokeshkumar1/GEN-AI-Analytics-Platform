name: Enterprise local verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# These jobs never load repository .env files or use cloud credentials.
# Real HANA/LLM/connector tests require a separate workflow_dispatch workflow,
# isolated test schema, explicit secrets and a protected environment with reviewers.
# No cloud verification is claimed by this workflow.
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt httpx
      - run: python scripts/run_offline_tests.py
      - run: python -m compileall -q backend/api scripts

  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: python -m ruff check --isolated backend/api backend/tests scripts
      - if: always()
        run: python -m ruff format --isolated --check backend/api backend/tests scripts

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - if: always()
        run: npm run build

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm audit --prefix frontend --audit-level=high
      - if: always()
        run: npm audit --prefix router --audit-level=high
      - if: always()
        run: npm audit --prefix backend/db --audit-level=high
      - if: always()
        run: python -m pip install pip-audit && python -m pip_audit -r backend/requirements.txt
